<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HERMES · Neural Command</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07060a;
      --gold: #d4af7a;
      --gold-soft: rgba(212, 175, 122, 0.22);
      --ice: #e8eef8;
      --teal: #3ee0c8;
      --ink: #9aa3b5;
      --glass: rgba(10, 10, 14, 0.42);
      --line: rgba(232, 238, 248, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--ice); overflow: hidden; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }
    #stage { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }

    .vignette {
      pointer-events: none;
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 50% 42%, transparent 18%, rgba(7,6,10,.55) 70%, #07060a 100%),
        linear-gradient(180deg, rgba(7,6,10,.55) 0%, transparent 18%, transparent 72%, rgba(7,6,10,.72) 100%);
      z-index: 2;
    }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 8;
      display: flex; align-items: center; justify-content: space-between;
      padding: max(14px, env(safe-area-inset-top)) 22px 10px;
      pointer-events: none;
    }
    header > * { pointer-events: auto; }
    .wordmark { font-family: "Cormorant Garamond", serif; font-size: 22px; letter-spacing: .28em; font-weight: 500; }
    .wordmark span { color: var(--gold); }
    .live {
      display: flex; align-items: center; gap: 8px;
      font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #c45a4a; box-shadow: 0 0 10px #c45a4a; }
    .dot.on { background: var(--teal); box-shadow: 0 0 12px var(--teal); }

    .focus-title {
      position: fixed; top: 18%; left: 50%; transform: translateX(-50%);
      z-index: 6; text-align: center; pointer-events: none;
      opacity: 0; transition: opacity .35s ease;
    }
    .focus-title.show { opacity: 1; }
    .focus-title h2 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 500; font-style: italic;
      font-size: clamp(28px, 6vw, 54px);
      letter-spacing: .04em;
    }
    .focus-title p { margin-top: 6px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink); }

    .rail {
      position: fixed; top: 72px; right: 18px; bottom: 168px; width: min(300px, 32vw);
      z-index: 7; display: flex; flex-direction: column; gap: 10px;
      pointer-events: none;
    }
    .card {
      pointer-events: auto;
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 18px;
      padding: 14px 16px;
    }
    .k { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink); }
    .v { font-family: "Cormorant Garamond", serif; font-size: 28px; margin-top: 2px; }
    .row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: #c9d0dc; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .muted { color: var(--ink); }
    .log { font-size: 11px; line-height: 1.45; color: #b8c0ce; max-height: 160px; overflow: auto; }
    .log b { color: var(--gold); font-weight: 500; }

    .dock {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
      padding: 0 18px max(18px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .heard {
      min-height: 22px; text-align: center;
      font-family: "Cormorant Garamond", serif; font-style: italic;
      font-size: 18px; color: var(--gold);
    }
    .speak {
      appearance: none; border: 0; cursor: pointer;
      width: min(92vw, 420px); height: 72px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(232,238,248,.1), rgba(10,10,14,.55));
      border: 1px solid rgba(212,175,122,.35);
      color: var(--ice);
      display: flex; align-items: center; justify-content: center; gap: 14px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
      transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
      -webkit-user-select: none; user-select: none;
    }
    .speak:active, .speak.held {
      transform: scale(.985);
      border-color: var(--teal);
      box-shadow: 0 0 0 8px rgba(62,224,200,.08), 0 22px 70px rgba(62,224,200,.18);
      background: linear-gradient(180deg, rgba(62,224,200,.16), rgba(10,10,14,.6));
    }
    .orb {
      width: 18px; height: 18px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, var(--gold) 45%, #8a6a3a);
      box-shadow: 0 0 16px var(--gold);
    }
    .speak.held .orb {
      background: radial-gradient(circle at 35% 30%, #fff, var(--teal) 50%, #14685c);
      box-shadow: 0 0 22px var(--teal);
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 50% { transform: scale(1.18); } }
    .speak strong { font-size: 13px; letter-spacing: .28em; font-weight: 500; }
    .hint { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }

    .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .chip {
      border: 1px solid var(--line); background: rgba(255,255,255,.03);
      color: var(--ice); border-radius: 999px; padding: 7px 12px; font-size: 11px; letter-spacing: .08em;
    }

    .uplink {
      position: fixed; top: 56px; left: 18px; z-index: 8; width: min(360px, calc(100vw - 36px));
      display: none;
    }
    .uplink.open { display: block; }
    .uplink input {
      width: 100%; margin-top: 8px; background: transparent; border: 0; border-bottom: 1px solid var(--line);
      color: var(--ice); font: inherit; padding: 8px 0; outline: none;
    }
    .ghost { background: none; border: 0; color: var(--ink); font: inherit; letter-spacing: .16em; text-transform: uppercase; font-size: 10px; cursor: pointer; }

    .boot {
      position: fixed; inset: 0; z-index: 20; background: #07060a;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      transition: opacity .7s ease;
    }
    .boot.hide { opacity: 0; pointer-events: none; }
    .boot h1 { font-family: "Cormorant Garamond", serif; letter-spacing: .4em; font-weight: 500; font-size: 28px; }
    .boot p { letter-spacing: .28em; text-transform: uppercase; font-size: 11px; color: var(--ink); }

    @media (max-width: 820px) {
      .rail { display: none; }
      .wordmark { letter-spacing: .18em; font-size: 18px; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="vignette"></div>

  <header>
    <div class="wordmark">HERMES <span>NDS</span></div>
    <div style="display:flex;align-items:center;gap:14px">
      <button class="ghost" id="uplinkBtn" type="button">Uplink</button>
      <div class="live"><i class="dot" id="liveDot"></i><span id="liveLbl">Local mesh</span></div>
    </div>
  </header>

  <div class="uplink card" id="uplink">
    <div class="k">Agent origin</div>
    <input id="origin" spellcheck="false" placeholder="https://your-tunnel.trycloudflare.com" />
    <div class="hint" style="margin-top:8px">Save once. This phone will keep using it.</div>
  </div>

  <div class="focus-title" id="focusTitle">
    <h2 id="focusName">Neural core</h2>
    <p id="focusMeta">Touch a node</p>
  </div>

  <aside class="rail">
    <div class="card">
      <div class="k">Cognitive load</div>
      <div class="v" id="load">—</div>
      <div class="muted" id="mode" style="font-size:12px;margin-top:4px">Waiting for Hermes</div>
    </div>
    <div class="card">
      <div class="k">Active work</div>
      <div id="work"></div>
    </div>
    <div class="card" style="flex:1;min-height:0">
      <div class="k">Live log</div>
      <div class="log" id="log"></div>
    </div>
  </aside>

  <div class="dock">
    <div class="heard" id="heard"></div>
    <button class="speak" id="speak" type="button">
      <span class="orb"></span>
      <strong id="speakLbl">HOLD TO SPEAK</strong>
    </button>
    <div class="hint" id="statusHint">Press and hold · release to send</div>
    <div class="chips">
      <button class="chip" data-cmd="status">Status</button>
      <button class="chip" data-cmd="projects">Projects</button>
      <button class="chip" data-cmd="focus atlas">Atlas</button>
    </div>
  </div>

  <div class="boot" id="boot">
    <h1>HERMES</h1>
    <p>Opening the room</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const HERMES_DEFAULT_ORIGIN = "https://area-interval-possession-options.trycloudflare.com";
    const KEY = "hermes.origin";
    const $ = (id) => document.getElementById(id);

    function unwrap(raw) {
      if (raw == null) return null;
      if (typeof raw !== "string") return raw;
      const t = raw.trim();
      if (!t) return null;
      try { return JSON.parse(t); } catch {}
      const a = t.indexOf("{"), b = t.lastIndexOf("}");
      if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch {} }
      return null;
    }

    function origin() {
      const host = location.hostname;
      if (host === "localhost" || host === "127.0.0.1" || host.endsWith(".trycloudflare.com")) return location.origin;
      return localStorage.getItem(KEY) || HERMES_DEFAULT_ORIGIN;
    }

    const state = {
      origin: origin(),
      live: false,
      via: "Local mesh",
      dash: null,
      voice: 0,
      held: false,
      focus: null,
    };

    const mock = {
      totals: { sessions: 12, tools: 48, files: 9 },
      sessions: [
        { id: "s1", title: "Atlas briefing", project: "Atlas", status: "active", updated_at: Date.now() },
        { id: "s2", title: "Command surface", project: "Hermes NDS", status: "active", updated_at: Date.now() - 4e5 },
      ],
      tools: [{ name: "read", count: 40 }, { name: "edit", count: 22 }, { name: "exec", count: 11 }],
      system: { cpu: 31, memory: 54, uptime: "4h" },
      cognitive_load: 0.46,
      brain_activity: [
        { id: "atlas", label: "Atlas", load: 0.88, kind: "project" },
        { id: "nds", label: "Hermes NDS", load: 0.7, kind: "project" },
        { id: "core", label: "Core", load: 0.55, kind: "system" },
      ],
      activity_log: [
        { t: Date.now() - 2e4, who: "Hermes", what: "Standing by for your voice." },
        { t: Date.now() - 9e4, who: "Atlas", what: "Session warm." },
      ],
    };

    function dash() { return state.dash || mock; }

    function setLive(on, via) {
      state.live = on;
      state.via = via;
      $("liveDot").classList.toggle("on", on);
      $("liveLbl").textContent = via;
    }

    function paint() {
      const d = dash();
      const load = d.cognitive_load ?? 0;
      $("load").textContent = Math.round(load * 100) + "%";
      $("mode").textContent = load > 0.72 ? "Saturated" : load > 0.4 ? "In motion" : "Quiet";
      $("work").innerHTML = (d.sessions || []).slice(0, 4).map((s) => (
        `<div class="row"><span>${s.title || s.project}</span><span class="muted">${s.status || ""}</span></div>`
      )).join("") || `<div class="muted">No open work</div>`;
      $("log").innerHTML = (d.activity_log || []).slice(0, 8).map((e) => (
        `<div><b>${e.who || "Hermes"}</b> ${e.what || e.text || ""}</div>`
      )).join("");
    }

    /* ---------------- scene ---------------- */
    const stage = $("stage");
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 80);
    camera.position.set(0, 0.15, 6.2);

    scene.add(new THREE.AmbientLight(0xb8c4d8, 0.35));
    const key = new THREE.PointLight(0xd4af7a, 1.6, 20);
    key.position.set(3.4, 2.2, 4);
    scene.add(key);
    const fill = new THREE.PointLight(0x3ee0c8, 0.55, 18);
    fill.position.set(-3.2, -1.4, 3);
    scene.add(fill);

    const group = new THREE.Group();
    scene.add(group);

    function makeGlowTex() {
      const c = document.createElement("canvas");
      c.width = c.height = 128;
      const g = c.getContext("2d");
      const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      grd.addColorStop(0, "rgba(255,255,255,1)");
      grd.addColorStop(0.35, "rgba(232,238,248,.45)");
      grd.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = grd;
      g.fillRect(0, 0, 128, 128);
      const t = new THREE.CanvasTexture(c);
      t.needsUpdate = true;
      return t;
    }
    const glowTex = makeGlowTex();

    const coreMat = new THREE.MeshPhysicalMaterial({
      color: 0x1a1820,
      metalness: 0.35,
      roughness: 0.18,
      transmission: 0.72,
      thickness: 1.4,
      transparent: true,
      opacity: 0.92,
      emissive: 0x3ee0c8,
      emissiveIntensity: 0.08,
    });
    const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.05, 3), coreMat);
    group.add(core);

    const inner = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.42, 2),
      new THREE.MeshBasicMaterial({ color: 0xd4af7a })
    );
    group.add(inner);

    const shell = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.28, 1),
      new THREE.MeshBasicMaterial({ color: 0xe8eef8, wireframe: true, transparent: true, opacity: 0.09 })
    );
    group.add(shell);

    const rings = [];
    for (let i = 0; i < 3; i++) {
      const geo = new THREE.TorusGeometry(1.55 + i * 0.28, 0.006, 8, 180);
      const mat = new THREE.MeshBasicMaterial({ color: i === 1 ? 0xd4af7a : 0x3ee0c8, transparent: true, opacity: 0.22 - i * 0.04 });
      const m = new THREE.Mesh(geo, mat);
      m.rotation.x = Math.PI / 2 + i * 0.4;
      m.rotation.y = i * 0.7;
      group.add(m);
      rings.push(m);
    }

    const pCount = 2200;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(pCount * 3);
    const pCol = new Float32Array(pCount * 3);
    const gold = new THREE.Color(0xd4af7a);
    const ice = new THREE.Color(0xe8eef8);
    const teal = new THREE.Color(0x3ee0c8);
    for (let i = 0; i < pCount; i++) {
      const r = 1.2 + Math.random() * 2.8;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      pPos[i * 3] = r * Math.sin(ph) * Math.cos(th);
      pPos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th);
      pPos[i * 3 + 2] = r * Math.cos(ph);
      const c = i % 5 === 0 ? gold : i % 3 === 0 ? teal : ice;
      pCol[i * 3] = c.r; pCol[i * 3 + 1] = c.g; pCol[i * 3 + 2] = c.b;
    }
    pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
    pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3));
    const points = new THREE.Points(pGeo, new THREE.PointsMaterial({
      size: 0.02, transparent: true, opacity: 0.62, depthWrite: false, vertexColors: true,
    }));
    group.add(points);

    const coreGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, color: 0xd4af7a, transparent: true, opacity: 0.35, depthWrite: false, blending: THREE.AdditiveBlending,
    }));
    coreGlow.scale.set(3.2, 3.2, 1);
    group.add(coreGlow);

    const arcs = [];
    for (let i = 0; i < 6; i++) {
      const curve = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()
      );
      const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(28));
      const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
        color: 0x3ee0c8, transparent: true, opacity: 0, blending: THREE.AdditiveBlending,
      }));
      group.add(line);
      arcs.push({ line, curve });
    }

    const nodes = [];
    function placeNodes() {
      nodes.forEach((n) => group.remove(n.mesh));
      nodes.length = 0;
      const acts = (dash().brain_activity || []).slice(0, 8);
      acts.forEach((a, i) => {
        const ang = (i / Math.max(acts.length, 1)) * Math.PI * 2;
        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.085, 16, 16),
          new THREE.MeshBasicMaterial({ color: a.kind === "project" ? 0xd4af7a : 0x3ee0c8 })
        );
        const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: a.kind === "project" ? 0xd4af7a : 0x3ee0c8, transparent: true, opacity: 0.55, depthWrite: false }));
        halo.scale.set(0.55, 0.55, 1);
        mesh.add(halo);
        const hit = new THREE.Mesh(
          new THREE.SphereGeometry(0.28, 8, 8),
          new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
        );
        mesh.add(hit);
        mesh.userData = { id: a.id, label: a.label, load: a.load || 0.4, kind: a.kind };
        group.add(mesh);
        nodes.push({ mesh, ang, r: 2.05 + (i % 3) * 0.18, y: Math.sin(i) * 0.55, data: a });
      });
    }
    placeNodes();

    const ray = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let targetRot = { x: 0, y: 0 };
    let dragging = false, lastX = 0, lastY = 0;

    function onPointer(e) {
      const x = e.clientX ?? (e.touches && e.touches[0].clientX) ?? 0;
      const y = e.clientY ?? (e.touches && e.touches[0].clientY) ?? 0;
      pointer.x = (x / innerWidth) * 2 - 1;
      pointer.y = -(y / innerHeight) * 2 + 1;
      if (!state.held) {
        targetRot.y = pointer.x * 0.35;
        targetRot.x = pointer.y * 0.18;
      }
    }
    window.addEventListener("pointermove", (e) => {
      onPointer(e);
      if (dragging && !state.held) {
        group.rotation.y += (e.clientX - lastX) * 0.006;
        group.rotation.x += (e.clientY - lastY) * 0.004;
        lastX = e.clientX; lastY = e.clientY;
      }
    });
    renderer.domElement.addEventListener("pointerdown", (e) => {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      onPointer(e);
      ray.setFromCamera(pointer, camera);
      const hits = ray.intersectObjects(nodes.map((n) => n.mesh), true);
      if (hits.length) {
        const obj = hits[0].object.parent && hits[0].object.parent.userData.id ? hits[0].object.parent : hits[0].object;
        const d = obj.userData;
        if (d && d.id) {
          state.focus = d;
          $("focusName").textContent = d.label;
          $("focusMeta").textContent = (d.kind || "node") + " · " + Math.round((d.load || 0) * 100) + "% load";
          $("focusTitle").classList.add("show");
          speakLine("Focusing " + d.label);
        }
      }
    });
    window.addEventListener("pointerup", () => { dragging = false; });

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    let t = 0;
    function tick() {
      requestAnimationFrame(tick);
      t += 0.016;
      const v = state.voice;
      const breath = 1 + Math.sin(t * 1.4) * 0.018 + v * 0.16;
      core.scale.setScalar(breath);
      inner.rotation.y += 0.01 + v * 0.03;
      inner.scale.setScalar(0.9 + v * 0.45);
      shell.rotation.y -= 0.002;
      shell.rotation.x += 0.001;
      points.rotation.y += 0.0008 + v * 0.012;
      points.material.opacity = 0.45 + v * 0.45;
      coreGlow.scale.setScalar(3.1 + v * 2.4);
      coreGlow.material.opacity = 0.22 + v * 0.55;
      coreGlow.material.color.set(v > 0.35 ? 0x3ee0c8 : 0xd4af7a);
      rings.forEach((r, i) => { r.rotation.z += 0.002 + i * 0.0007 + v * 0.014; r.material.opacity = 0.16 + v * 0.35; });
      arcs.forEach((a, i) => {
        const show = v > 0.18 && (Math.floor(t * 8 + i) % 3 === 0);
        a.line.material.opacity = show ? 0.15 + v * 0.55 : a.line.material.opacity * 0.86;
        if (show) {
          const n1 = nodes[i % Math.max(nodes.length, 1)];
          const n2 = nodes[(i + 2) % Math.max(nodes.length, 1)];
          const p1 = n1 ? n1.mesh.position : new THREE.Vector3(1.4, 0, 0);
          const p2 = n2 ? n2.mesh.position : new THREE.Vector3(-1.4, 0.2, 0);
          a.curve.v0.copy(p1);
          a.curve.v2.copy(p2);
          a.curve.v1.set((p1.x + p2.x) * 0.3, 0.8 + Math.sin(t + i) * 0.4, (p1.z + p2.z) * 0.3);
          a.line.geometry.setFromPoints(a.curve.getPoints(28));
        }
      });
      if (!dragging) {
        group.rotation.y += (targetRot.y - group.rotation.y) * 0.03 + 0.0012;
        group.rotation.x += (targetRot.x - group.rotation.x) * 0.03;
      }
      const load = dash().cognitive_load || 0.4;
      coreMat.emissiveIntensity = 0.06 + load * 0.22 + v * 0.55;
      key.intensity = 1.4 + v * 1.8;
      fill.intensity = 0.4 + v * 1.2;
      nodes.forEach((n, i) => {
        const spin = t * 0.22 + n.ang;
        n.mesh.position.set(Math.cos(spin) * n.r, n.y + Math.sin(t * 0.8 + i) * 0.08, Math.sin(spin) * n.r);
        const hot = state.focus && state.focus.id === n.data.id;
        n.mesh.scale.setScalar(hot ? 1.45 : 1);
      });
      renderer.render(scene, camera);
    }
    tick();

    /* ---------------- voice / jarvis ---------------- */
    const synth = window.speechSynthesis;
    function speakLine(text) {
      $("heard").textContent = text;
      $("statusHint").textContent = text;
      if (!synth) return;
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.94; u.pitch = 0.92; u.volume = 0.9;
      const voices = synth.getVoices();
      u.voice = voices.find((v) => /Daniel|Samantha|Karen|Google UK English Female/i.test(v.name)) || voices[0];
      synth.speak(u);
    }

    function reply(cmd) {
      const d = dash();
      const q = cmd.toLowerCase();
      if (/status|how are you|report/.test(q)) {
        return `Online. Cognitive load ${Math.round((d.cognitive_load || 0) * 100)} percent. ${d.sessions?.length || 0} sessions in motion.`;
      }
      if (/project/.test(q)) {
        const names = (d.brain_activity || []).map((a) => a.label).slice(0, 4).join(", ");
        return names ? `Active work: ${names}.` : "No projects on the board.";
      }
      if (/atlas/.test(q)) return "Atlas is the lead thread. I am holding that briefing open.";
      if (/focus (.+)/.test(q)) {
        const name = q.replace(/.*focus\s+/, "");
        const hit = (d.brain_activity || []).find((a) => (a.label || "").toLowerCase().includes(name));
        if (hit) {
          state.focus = hit;
          $("focusName").textContent = hit.label;
          $("focusMeta").textContent = "Pinned from voice";
          $("focusTitle").classList.add("show");
          return `Looking at ${hit.label}.`;
        }
      }
      return `I heard you. ${cmd}`;
    }

    let rec = null, transcript = "";
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      rec = new SR();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = "en-US";
      rec.onresult = (e) => {
        let said = "";
        for (let i = 0; i < e.results.length; i++) said += e.results[i][0].transcript;
        transcript = said.trim();
        $("heard").textContent = transcript || "Listening…";
      };
      rec.onerror = () => {};
    }

    let audioCtx = null, analyser = null, micStream = null, voiceRaf = 0;
    async function openMic() {
      if (micStream) return;
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        audioCtx.createMediaStreamSource(micStream).connect(analyser);
      } catch {}
    }
    function sampleVoice() {
      if (!state.held) { state.voice *= 0.9; return; }
      if (analyser) {
        const buf = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) {
          const n = (buf[i] - 128) / 128;
          sum += n * n;
        }
        const rms = Math.sqrt(sum / buf.length);
        state.voice = Math.min(1, state.voice * 0.55 + rms * 4.2);
      } else {
        state.voice = 0.45 + Math.abs(Math.sin(performance.now() / 180)) * 0.25;
      }
      voiceRaf = requestAnimationFrame(sampleVoice);
    }

    const speakBtn = $("speak");
    async function startHold(e) {
      e.preventDefault();
      try { speakBtn.setPointerCapture(e.pointerId); } catch {}
      state.held = true;
      state.voice = 0.4;
      transcript = "";
      speakBtn.classList.add("held");
      $("speakLbl").textContent = "LISTENING";
      $("statusHint").textContent = "Release to send";
      $("heard").textContent = "Listening…";
      await openMic();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      cancelAnimationFrame(voiceRaf);
      sampleVoice();
      if (rec) { try { rec.start(); } catch {} }
      navigator.vibrate && navigator.vibrate(12);
    }
    function endHold(e) {
      e.preventDefault();
      if (!state.held) return;
      state.held = false;
      speakBtn.classList.remove("held");
      $("speakLbl").textContent = "HOLD TO SPEAK";
      if (rec) { try { rec.stop(); } catch {} }
      const cmd = transcript || "";
      state.voice = 0;
      if (cmd) speakLine(reply(cmd));
      else $("statusHint").textContent = "Press and hold · release to send";
    }
    speakBtn.addEventListener("pointerdown", startHold);
    speakBtn.addEventListener("pointerup", endHold);
    speakBtn.addEventListener("pointercancel", endHold);
    speakBtn.addEventListener("lostpointercapture", endHold);

    document.querySelectorAll(".chip").forEach((b) => {
      b.addEventListener("click", () => speakLine(reply(b.dataset.cmd)));
    });

    $("uplinkBtn").onclick = () => $("uplink").classList.toggle("open");
    $("origin").value = localStorage.getItem(KEY) || "";
    $("origin").onchange = () => {
      const v = $("origin").value.trim().replace(/\/$/, "");
      if (v) localStorage.setItem(KEY, v);
      else localStorage.removeItem(KEY);
      state.origin = origin();
      connect();
    };

    /* ---------------- live feed ---------------- */
    let ws, poll;
    async function pull() {
      try {
        const r = await fetch(state.origin + "/api/dashboard.json", { cache: "no-store" });
        if (!r.ok) throw 0;
        const j = unwrap(await r.text());
        if (j && typeof j === "object") {
          state.dash = j;
          setLive(true, "Live agent");
          placeNodes();
          paint();
          return true;
        }
      } catch {}
      return false;
    }
    function connect() {
      if (ws) { try { ws.close(); } catch {} ws = null; }
      clearInterval(poll);
      const base = state.origin.replace(/^http/, "ws");
      try {
        ws = new WebSocket(base + "/ws");
        ws.onmessage = (ev) => {
          const j = unwrap(ev.data);
          if (j && typeof j === "object") {
            state.dash = { ...dash(), ...j };
            setLive(true, "Live stream");
            placeNodes();
            paint();
          }
        };
        ws.onopen = () => setLive(true, "Live stream");
        ws.onclose = () => { if (!state.live) setLive(false, "Local mesh"); };
      } catch {}
      poll = setInterval(pull, 4000);
      pull();
    }

    paint();
    connect();
    setTimeout(() => $("boot").classList.add("hide"), 900);
    setTimeout(() => speakLine("Hermes is with you."), 1100);
  </script>
</body>
</html>
